<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><title>六本豆 Lite · 任务记忆</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="六本豆 Lite 首页"><span class="brand-mark">六</span><span>六本豆 <span class="lite-label">Lite</span></span></a>
    <div class="sidebar-intro">把每一次接手，接得更顺。</div>
    <button class="new-task" data-action="new-task"><span>＋</span> 新建任务</button>
    <label class="sidebar-search"><span aria-hidden="true">⌕</span><input id="task-filter" placeholder="搜索任务…" aria-label="搜索任务"></label>
    <div class="section-label">我的任务 <span id="task-count">0</span></div>
    <nav id="task-list" aria-label="任务列表"><div class="loading">正在读取任务…</div></nav>
    <button class="archive-toggle" data-action="toggle-archived">查看已归档任务</button>
    <div class="sidebar-bottom">
      <button class="nav-button" data-action="connection"><span class="nav-icon">↗</span> 接入与提示词</button>
      <button class="nav-button" id="invite-button" data-action="invite" hidden>生成邀请码（管理员）</button>
      <button class="nav-button" id="license-button" data-action="license" hidden>离线授权与续期</button>
      <div class="local-indicator"><i></i> 数据保存在本机 <span>v0.3.3</span></div>
    </div>
  </aside>
  <main>
    <header class="topbar"><div><span class="breadcrumb-muted">本地工作台</span><span class="slash">/</span><span id="breadcrumb">任务记忆</span></div><span class="service-status" id="service-status"><i></i> 正在连接</span></header>
    <div id="workspace" class="workspace"><div class="loading large">正在打开工作台…</div></div>
    <footer class="page-footer"><span>记住进展，也记住为什么。</span><span id="runtime-status">本地保存 · 按任务隔离</span></footer>
  </main>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
